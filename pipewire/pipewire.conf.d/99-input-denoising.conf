context.properties = {
    ## Define a taxa padrão (jogos, sistema, vídeos do YouTube)
    default.clock.rate          = 48000
    
    ## Permite que o Pipewire mude nativamente para resoluções de áudio Hi-Res 
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
    
    ## Quantum (Buffer) estável para evitar Xruns (estalos) no Hyprland
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 4096
}

context.modules = [
    {   
        name = libpipewire-module-filter-chain
        args = {
            node.description =  "Noise Canceling Stereo Source"
            media.name =  "Noise Canceling Stereo Source"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = rnnoise_L
                        plugin = "librnnoise_ladspa"
                        label = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)" = 90.0
                            "VAD Grace Period (ms)" = 150
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                    {
                        type = ladspa
                        name = rnnoise_R
                        plugin = "librnnoise_ladspa"
                        label = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)" = 90.0
                            "VAD Grace Period (ms)" = 150
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
                inputs  = [ "rnnoise_L:Input" "rnnoise_R:Input" ]
                outputs = [ "rnnoise_L:Output" "rnnoise_R:Output" ]
            }
            capture.props = {
                node.name =  "capture.rnnoise_source"
                node.passive = true
                audio.rate = 48000
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name =  "rnnoise_source"
                media.class = Audio/Source
                audio.rate = 48000
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
