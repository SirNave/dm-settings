genera {
    screencopy_mode = 0
    disable_loading_bar = true
    hide_cursor = true
    grace = 5
    no_fade_in = false
}

auth {
    pam:enabled	= true
    pam:module = /etc/pam.d/hyprlock
    fingerprint:enabled = true
    fingerprint:ready_message = fingerprint ready
    fingerprint:present_message = fingerprint pass
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 10, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 6
    blur_size = 1
    noise = 0.0117
    vibrancy = 0.5
    vibrancy_darkness = 0.5
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    font_size = 24
    font_family = Noto Sans Sora Sompeng Bold
    position = 0, -100
    halign = center
    valign = top
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    font_size = 200
    font_family = Noto Sans Sora Sompeng Bold
    position = 0, -150
    halign = center
    valign = top
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    font_size = 200
    font_family = Noto Sans Sora Sompeng Bold
    position = 0, -475
    halign = center
    valign = top
}

# Seconds-Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%S")"
    font_size = 40
    font_family = Noto Sans Sora Sompeng Bold
    position = 0, -460
    halign = center
    valign = top
}

# USER
label {
    monitor =
    text =   $USER
    font_size = 55
    font_family = Noto Sans Sora Sompeng Bold
    position = 0, 300
    halign = center
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# INPUT FIELD
input-field {
    monitor =
    size = 350, 60
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    fade_on_empty = false
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    fail_color = rgb(FF0000)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_timeout = 5000 # milliseconds before fail_text and fail_color disappears
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = rgb(FF8100)
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, 200
    halign = center
    valign = bottom
    font_family = Noto Sans Sora Sompeng Bold
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
}

# UPTIME
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$(uptime -p)" </b>"
    font_size = 18
    font_family = Noto Sans Sora Sompeng Bold
    position = 0, 0
    halign = right
    valign = bottom
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/nowplaying.sh 2>/dev/null)" 
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = Noto Sans Sora Sompeng Bold
    position = 20, 20
    halign = left
    valign = bottom
}

image {
    monitor =
    path = /tmp/spotify_album_art.png
    onclick = "$(~/.config/hypr/scripts/nowplaying.sh --toggle)"
    border_size = 2
    border_color = rgba(255, 255, 255, 0)
    size = 150
    rounding = 14
    rotate = 0
    reload_time = 2
    position = 10, 100
    halign = left
    valign = bottom
}