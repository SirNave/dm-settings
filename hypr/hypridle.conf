general {
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
    
    lock_cmd = notify-send "lock!" && pidof hyprlock || hyprlock       # Garante que só abra um processo do hyprlock
    unlock_cmd = killall -9 hyprlock && notify-send "unlock!"          # Força o fechamento ao destravar
    before_sleep_cmd = notify-send "Zzz" && loginctl lock-session    # Bloqueia antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on && notify-send "Awake!"  # Liga a tela ao acordar
}

listener {
    timeout = 140
    on-timeout = notify-send "10s to idle!"
    on-resume = notify-send "Welcome back"
}

listener {
    timeout = 150
    on-timeout = brightnessctl set 10
    on-resume = brightnessctl set 10%
}

listener {
    timeout = 150
    on-timeout = brightnessctl -d *:kbd_backlight set 0 
    on-resume = brightnessctl -d *:kbd_backlight set 50%
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r 
}
